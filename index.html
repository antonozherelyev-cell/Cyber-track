
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cyber Track</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05000d;font-family:Arial}
canvas{width:100%;height:100%;display:block}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#05000d;color:white;text-align:center}
h1{color:#00f6ff;font-size:46px;text-shadow:0 0 20px #00f6ff}
button{font-size:25px;font-weight:bold;padding:18px 35px;border-radius:15px;border:2px solid #00f6ff;background:#10152d;color:#00f6ff}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="start">
<h1>CYBER TRACK</h1>
<p>TESLA STREET RACE</p>
<button onclick="start()">START RACE</button>
</div>

<script>
const c=document.getElementById("c"),x=c.getContext("2d");
let W,H,run=false,over=false,lane=1,cars=[],score=0,last=0;

function size(){W=innerWidth;H=innerHeight;c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
onresize=size;size();

function lx(n){return W/2+(n-1)*Math.min(105,W*.23)}

function start(){
 document.getElementById("start").style.display="none";
 run=true;over=false;lane=1;cars=[];score=0;last=performance.now();
 requestAnimationFrame(loop);
}

function move(n){
 if(over){start();return}
 lane=Math.max(0,Math.min(2,lane+n));
}

document.addEventListener("keydown",e=>{
 if(e.key=="ArrowLeft"||e.key.toLowerCase()=="a")move(-1);
 if(e.key=="ArrowRight"||e.key.toLowerCase()=="d")move(1);
});

document.addEventListener("touchstart",e=>{
 if(!run)return;
 if(e.touches[0].clientX<W/2)move(-1);
 else move(1);
});

function spawn(){
 cars.push({
  lane:Math.floor(Math.random()*3),
  y:-80,
  color:["#e82127","#eee","#222","#1683d8","#999"][Math.floor(Math.random()*5)]
 });
}

function tesla(px,py,col){
 x.save();x.translate(px,py);
 x.fillStyle="#050505";
 x.fillRect(-25,-23,8,18);x.fillRect(17,-23,8,18);
 x.fillRect(-25,5,8,18);x.fillRect(17,5,8,18);
 x.fillStyle=col;
 x.beginPath();x.roundRect(-21,-36,42,72,9);x.fill();
 x.fillStyle="#111";
 x.beginPath();x.roundRect(-13,-23,26,18,5);x.fill();
 x.fillStyle="#e82127";
 x.font="bold 6px Arial";
 x.textAlign="center";
 x.fillText("TESLA",0,8);
 x.restore();
}

function draw(){
 x.fillStyle="#05000d";x.fillRect(0,0,W,H);

 for(let i=0;i<25;i++){
  x.fillStyle=i%2?"#10002b":"#001525";
  x.fillRect(0,(i*60-score*2)%H,W,3);
 }

 let rw=Math.min(340,W*.9),L=W/2-rw/2;
 x.fillStyle="#111827";x.fillRect(L,0,rw,H);

 x.fillStyle="#00f6ff";
 x.shadowBlur=15;x.shadowColor="#00f6ff";
 x.fillRect(L,0,5,H);x.fillRect(L+rw-5,0,5,H);

 x.strokeStyle="#ff00e6";x.lineWidth=4;
 x.setLineDash([30,30]);
 for(let i=1;i<3;i++){
  x.beginPath();
  x.moveTo(L+rw*i/3,-60+(score*4)%60);
  x.lineTo(L+rw*i/3,H);
  x.stroke();
 }
 x.setLineDash([]);x.shadowBlur=0;

 cars.forEach(a=>tesla(lx(a.lane),a.y,a.color));
 tesla(lx(lane),H-110,"#00d4ff");

 x.fillStyle="#00f6ff";x.font="bold 20px Arial";
 x.fillText("SCORE "+score,15,30);

 x.fillStyle="#ff00e6";x.font="bold 14px Arial";
 x.fillText("CYBER TRACK",W-120,30);

 if(over){
  x.fillStyle="#000b";x.fillRect(0,0,W,H);
  x.textAlign="center";
  x.fillStyle="white";
  x.font="bold 48px Arial";
  x.fillText("CRASH!",W/2,H/2);
  x.font="20px Arial";
  x.fillText("Tap the screen to race again",W/2,H/2+40);
  x.textAlign="left";
 }
}

function loop(t){
 if(!run)return;
 let dt=t-last;last=t;

 if(!over){
  score=Math.floor(t/1000);
  if(Math.random()<.025)spawn();

  cars.forEach(a=>a.y+=7);
  cars=cars.filter(a=>a.y<H+100);

  for(let a of cars){
   if(a.lane==lane && Math.abs(a.y-(H-110))<55)over=true;
  }
 }

 draw();
 requestAnimationFrame(loop);
}
</script>
